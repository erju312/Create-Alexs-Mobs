    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.cam]]
    modId="create"
    mandatory=true
    versionRange="[6.0.8,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.cam]]
